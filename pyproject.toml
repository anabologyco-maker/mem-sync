[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-claude-mem-sync"
version = "0.2.0"
description = "Project-scoped shared memory for Codex, Claude Code, and OpenCode"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "mem-sync contributors"}]
keywords = ["codex", "claude-code", "opencode", "memory", "developer-tools"]

[project.scripts]
mem-sync = "mem_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
